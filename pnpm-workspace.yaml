packages:
  - apps/*
  - packages/*
  - extensions/*
minimumReleaseAgeExclude:
  - eslint@10.14.0
  - framer-motion@14.9.0
  - i18next@26.5.12
  - lucide-react@1.66.0
  - motion-dom@14.9.0
  - motion@14.9.0
# esbuild's postinstall only re-checks its binary, which arrives as an optional dependency anyway.
allowBuilds:
  esbuild: false
