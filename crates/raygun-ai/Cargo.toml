[package]
name = "raygun-ai"
description = "Raygun AI subsystem: secrets store, model manager, translation providers and speech"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Offline Mode stops model downloads (raygun_net::network_mode).
raygun-net.workspace = true
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
# Voices and the speech runtime arrive as `.tar.bz2` archives (sherpa-onnx's releases); bzip2's
# default backend is pure Rust, so it builds for Android like the rest.
tar = { version = "0.4", default-features = false }
bzip2 = "0.6"
# The speech runtime (sherpa-onnx's C API and ONNX Runtime) is downloaded on demand and loaded at
# run time, never linked into the app.
libloading = "0.9"
# Model downloads stop when cancelled, wherever they are.
tokio-util = { version = "0.7", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = "0.3"
sha2 = "0.11"
# Whisper on the CPU (M46.32): pure Rust, so it builds for Android like the rest.
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
candle-transformers = { version = "0.11.1", default-features = false }
# OPUS-MT's SentencePiece tokenizers (M46.48), with the pure-Rust regex candle-core already uses.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
axum.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "time"] }
