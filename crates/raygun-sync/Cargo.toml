[package]
name = "raygun-sync"
description = "Raygun device sync: Noise-encrypted peer channel, pairing, sync protocol and discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-db.workspace = true
snow = "0.10"
# Browsers reach sync over WebRTC (docs/WEB.md): str0m's ICE-lite, DTLS (dimpl with RustCrypto)
# and SCTP, all Rust. No str0m crypto feature: its RustCrypto crate pulls in aws-lc for
# certificates, so web::provider gives str0m dimpl's backend and rcgen on ring instead.
str0m = { version = "0.25", default-features = false }
dimpl = { version = "0.9", default-features = false, features = ["rust-crypto"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"
if-addrs = "0.15"
mdns-sd = "0.21"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "time"] }
tracing.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
