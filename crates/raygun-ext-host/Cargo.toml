[package]
name = "raygun-ext-host"
description = "Raygun extension host: manifests, permissions, registry and the QuickJS runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-model.workspace = true
raygun-net.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
rquickjs = { version = "0.14", features = ["futures"] }
scraper = "0.24"
semver = "1"
sha2 = "0.11"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
axum.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros"] }
