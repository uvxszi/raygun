[package]
name = "raygun-ext-host"
description = "Raygun extension host: manifests, permissions, registry and the QuickJS runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-model.workspace = true
raygun-net.workspace = true
raygun-resolver.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net"] }
# QuickJS's own C asserts are off (NDEBUG), as in its release builds: a failed one aborts the whole
# app, e.g. a runtime dropped while something still holds one of its objects (reloads drop them).
rquickjs = { version = "0.14", features = ["futures", "disable-assertions"] }
# `deterministic` keeps attributes in source order when serialized, as Jsoup and Dart's `html`
# do; Shosetsu and Miru scripts match patterns against that HTML.
scraper = { version = "0.24", features = ["deterministic"] }
ego-tree = "0.10"
# Formulas in book text (`math`): TeX turned into MathML Core, which the webviews draw.
pulldown-latex = "0.8"
# Shosetsu (M32): building and renaming elements in scraper's tree, decoding bodies by charset,
# and dates for `os.date`/`os.time` and chapter releases.
html5ever = "0.35"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
regex = "1"
mlua = { version = "0.10", features = ["lua52", "vendored"] }
semver = "1"
sha2 = "0.11"
url = "2"
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Connected servers (`servers`) and Kodi repositories (`kodi`): OPDS feeds and `addons.xml`
# (gzipped as `addons.xml.gz`), Subsonic's salted tokens, HTTP Basic and Audiobookshelf's genre
# filters, and Jellyfin's play sessions.
quick-xml = "0.42"
md-5 = "0.11"
base64 = "0.22"
# Mihon conversions (`mihon`): OpenSSL-style AES some themes' pages come in (Madara's chapter
# protector).
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
# Keiyoushi's crypto helpers (`aesCbc`, `aesGcm`, `aesCtr`, digests, HMAC and PBKDF2) as
# converted code calls them.
aes-gcm = "0.10"
ctr = "0.9"
sha1 = "0.11"
hmac = "0.13"
uuid.workspace = true
# Random bytes for converted Nuclear plugins' `crypto.getRandomValues` (salts, keys).
getrandom = "0.3"
flate2 = "1"
# Java's public keys as converted sources use them (`KeyPairGenerator`, `KeyFactory`,
# `KeyAgreement`, `Signature`, RSA `Cipher`s): P-256 and RSA.
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "u64_digit"] }
# OAEP's SHA-1 mask (Java's default), on the digest traits `rsa` takes.
sha1_10 = { package = "sha1", version = "0.10" }
rand_core = { version = "0.6", features = ["getrandom"] }
# BLAKE2b digests (`org.kotlincrypto.hash.blake2.BLAKE2b`, `lib:e4p`).
blake2 = "0.10"
# PDF pages drawn into pictures (Android's `PdfRenderer` for sources whose chapters are PDF
# files), pure Rust; comics are pictures, so no fonts are embedded.
hayro = { version = "0.9", default-features = false }
# Pictures converted sources draw (`mihon::pictures`, over `raygun_net::bitmap`), and the text
# `lib:textinterceptor` draws on them in the system's own faces.
image = { version = "0.25", default-features = false }
ab_glyph = "0.2"
# Kodi add-ons (`kodi`): Python 3 run by RustPython (MIT), a pure-Rust interpreter. Its `host_env`
# feature stays off: the interpreter has no files, sockets, processes or environment of its own,
# only what `kodi::python` hands it. 0.6.0 was released against the 0.16.5 parser crates (later
# 0.16 patches changed the syntax tree it compiles) and malachite 0.12 (kept in Cargo.lock: its
# `pymath` asks for any 0.x).
rustpython-vm = { version = "=0.6.0", default-features = false, features = ["compiler", "gc", "importlib", "threading"] }
rustpython-stdlib = { version = "=0.6.0", default-features = false, features = ["compiler", "threading"] }
rustpython-ruff_python_ast = "=0.16.5"
rustpython-ruff_python_parser = "=0.16.5"
rustpython-ruff_python_trivia = "=0.16.5"
rustpython-ruff_source_file = "=0.16.5"
rustpython-ruff_text_size = "=0.16.5"
# Add-ons' `sqlite3` (caches, mostly), on the SQLite the app already links (sqlx's version, built
# from its bundled source as sqlx builds it).
libsqlite3-sys = { version = "0.37", features = ["bundled"] }

[build-dependencies]
# The standard library's Python half (CPython's `Lib`, as RustPython ships it): the modules
# add-ons use are packed into the binary at build time (`build.rs`).
rustpython-pylib = "=0.6.0"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"
axum.workspace = true
# The `call` example prints the extension's log.
tracing-subscriber.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros", "test-util"] }

# Calls a provider of one extension folder (`raygun-ext test`); its tests run with the crate's.
[[example]]
name = "call"
test = true
