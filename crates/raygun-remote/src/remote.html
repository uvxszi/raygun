    />
    <title>Raygun remote</title>
    <style>
      :root {
        --background: oklch(0.16 0.02 270);
        --surface: oklch(0.22 0.025 270);
        --foreground: oklch(0.96 0.01 270);
        --muted: oklch(0.7 0.02 270);
        --primary: oklch(0.72 0.19 25);
        color-scheme: dark;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --background: oklch(0.98 0.005 270);
          --surface: oklch(0.93 0.01 270);
          --foreground: oklch(0.2 0.02 270);
          --muted: oklch(0.45 0.02 270);
          --primary: oklch(0.58 0.2 25);
          color-scheme: light;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font:
          16px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 900;
        color: var(--primary);
        letter-spacing: -0.02em;
      }
      .muted {
        color: var(--muted);
        font-size: 14px;
      }
      .card {
        background: var(--surface);
        border-radius: 16px;
        padding: 16px;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      input {
        font: inherit;
        color: inherit;
        background: var(--background);
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        width: 100%;
        outline: none;
      }
      .primary {
        background: var(--primary);
        color: var(--background);
        font-weight: 700;
        border-radius: 999px;
        padding: 10px 20px;
      }
      #now {
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
        text-align: center;
      }
      #art {
        width: min(70vw, 260px);
        aspect-ratio: 1;
        border-radius: 16px;
        background: var(--background) center / cover no-repeat;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 56px;
      }
      #title {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
        overflow-wrap: anywhere;
      }
      #progress {
        width: 100%;
        height: 6px;
        background: var(--background);
        border-radius: 3px;
        cursor: pointer;
        position: relative;
      }
      #progress div {
        height: 100%;
        background: var(--primary);
        border-radius: 3px;
        width: 0;
      }
      .times {
        width: 100%;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .controls button {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
      }
      .controls #toggle {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--primary);
        color: var(--background);
      }
      svg {
        width: 26px;
        height: 26px;
        fill: currentColor;
      }
      #volume {
        width: 100%;
        accent-color: var(--primary);
      }
      .tabs {
        display: flex;
        gap: 8px;
      }
      .tabs button {
        padding: 6px 16px;
        border-radius: 999px;
        background: var(--surface);
        font-size: 14px;
      }
      .tabs button[aria-selected='true'] {
        background: var(--primary);
        color: var(--background);
        font-weight: 700;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li button {
        width: 100%;
        text-align: left;
        padding: 10px 4px;
        display: flex;
        flex-direction: column;
        border-radius: 8px;
      }
      li button[aria-current='true'] .name {
        color: var(--primary);
        font-weight: 700;
      }
      .name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .group {
        margin: 14px 0 4px;
        font-size: 13px;
        color: var(--muted);
      }
      #banner {
        background: var(--primary);
        color: var(--background);
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 14px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Raygun</h1>
        <span id="connection" class="muted"></span>
      </header>
      <p id="banner" role="alert" hidden></p>

      <section id="pair" class="card" hidden>
        <form id="pair-form" style="display: flex; flex-direction: column; gap: 12px">
          <strong>Pair this device</strong>
          <span class="muted" id="pair-hint"
            >Name this device, then pair. You can remove it later in Raygun's Settings.</span
          >
          <input id="pair-name" aria-label="Device name" maxlength="40" />
          <input id="pair-code" aria-label="Pairing code" placeholder="Pairing code" hidden />
          <button class="primary" type="submit">Pair</button>
        </form>
      </section>

      <div id="remote" hidden style="display: flex; flex-direction: column; gap: 20px">
        <section id="now" class="card" aria-label="Now playing">
          <div id="art" aria-hidden="true">♪</div>
          <div>
            <p id="title">Nothing playing</p>
            <p id="artist" class="muted" style="margin: 2px 0 0"></p>
            <p id="source" class="muted" style="margin: 2px 0 0; font-size: 12px"></p>
          </div>
          <div id="progress" role="slider" aria-label="Seek" aria-valuemin="0" tabindex="0">
            <div></div>
          </div>
          <div class="times"><span id="position">0:00</span><span id="duration">0:00</span></div>
          <div class="controls">
            <button id="previous" aria-label="Previous">
              <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" /></svg>
            </button>
            <button id="toggle" aria-label="Play">
              <svg viewBox="0 0 24 24" id="toggle-icon"><path d="M8 5v14l11-7z" /></svg>
            </button>
            <button id="next" aria-label="Next">
              <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" /></svg>
            </button>
          </div>
          <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Volume" />
        </section>

        <nav class="tabs" role="tablist">
          <button role="tab" id="tab-queue" aria-selected="true">Queue</button>
          <button role="tab" id="tab-search" aria-selected="false">Search</button>
        </nav>

        <section id="queue-panel" class="card">
          <ul id="queue"></ul>
          <p id="queue-empty" class="muted" hidden>The queue is empty.</p>
        </section>

        <section id="search-panel" class="card" hidden>
          <form id="search-form">
            <input
              id="search"
              type="search"
              placeholder="Search songs and artists…"
              aria-label="Search"
            />
          </form>
          <div id="results"></div>
        </section>
      </div>
    </main>

    <script>
      'use strict';
      const TOKEN_KEY = 'raygun-remote-token';
      const PLAY_ICON = '<path d="M8 5v14l11-7z"/>';
      const PAUSE_ICON = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
      const $ = (id) => document.getElementById(id);

      const storage = {
        get() {
          try {
            return localStorage.getItem(TOKEN_KEY);
          } catch {
            return null;
          }
        },
        set(value) {
          try {
            if (value) localStorage.setItem(TOKEN_KEY, value);
            else localStorage.removeItem(TOKEN_KEY);
          } catch {
            /* private windows: stays paired for this page only */
          }
        },
      };

      let token = storage.get();
      let snapshot = null;
      let events = null;
      let retryMs = 1000;
      let lastUpdate = 0;

      const formatTime = (ms) => {
        if (!ms || ms < 0) return '0:00';
        const seconds = Math.floor(ms / 1000);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      };

      const showBanner = (message) => {
        $('banner').textContent = message;
        $('banner').hidden = !message;
      };

      const api = async (path, options = {}) => {
        const response = await fetch(path, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
            ...(options.headers || {}),
          },
        });
        const body = await response.json().catch(() => ({}));
        if (response.status === 401) {
          unpair(body.error);
          throw new Error(body.error || 'Not paired');
        }
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        return body;
      };

      const unpair = (message) => {
        token = null;
        storage.set(null);
        if (events) events.close();
        events = null;
        showPairing(
          message || 'This device was removed. Scan the QR code in Raygun to pair again.',
        );
      };

      // ---- Pairing ----

      const pairCode = () => new URLSearchParams(location.hash.slice(1)).get('pair');

      const showPairing = (message) => {
        $('remote').hidden = true;
        $('pair').hidden = false;
        $('connection').textContent = '';
        const code = pairCode();
        $('pair-code').hidden = Boolean(code);
        if (message) showBanner(message);
        if (!$('pair-name').value) {
          const agent = navigator.userAgent;
          $('pair-name').value = /Android/.test(agent)
            ? 'Android browser'
            : /iPhone|iPad/.test(agent)
              ? 'iPhone browser'
              : /Mac/.test(agent)
                ? 'Mac browser'
                : /Windows/.test(agent)
                  ? 'Windows browser'
                  : 'Browser';
        }
      };

      $('pair-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const code = pairCode() || $('pair-code').value.trim();
        if (!code) {
          showBanner('Scan the QR code in Raygun, or type its pairing code.');
          $('pair-code').hidden = false;
          return;
        }
        try {
          const response = await fetch('/api/pair', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, name: $('pair-name').value }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
          token = body.token;
          storage.set(token);
          history.replaceState(null, '', location.pathname);
          showBanner('');
          start();
        } catch (error) {
          showBanner(error.message);
        }
      });

      // ---- Live state ----

      const render = () => {
        if (!snapshot) return;
        const { playback, queue } = snapshot;
        const current = playback.current;
        $('title').textContent = current ? current.title : 'Nothing playing';
        $('artist').textContent = current ? current.artist || '' : '';
        $('source').textContent = playback.source ? `via ${playback.source}` : playback.error || '';
        const art = $('art');
        if (current && current.artworkUrl) {
          art.style.backgroundImage = `url("${current.artworkUrl.replace(/"/g, '%22')}")`;
          art.textContent = '';
        } else {
          art.style.backgroundImage = '';
          art.textContent = '♪';
        }
        const playing =
          playback.status === 'playing' ||
          playback.status === 'buffering' ||
          playback.status === 'loading';
        $('toggle-icon').innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
        $('toggle').setAttribute('aria-label', playing ? 'Pause' : 'Play');
        if (document.activeElement !== $('volume')) $('volume').value = playback.volume;
        renderPosition();

        const list = $('queue');
        list.replaceChildren(
          ...queue.map((item) => {
            const row = document.createElement('li');
            const button = document.createElement('button');
            button.setAttribute('aria-current', String(item.current));
            const name = document.createElement('span');
            name.className = 'name';
            name.textContent = item.title;
            const artist = document.createElement('span');
            artist.className = 'name muted';
            artist.textContent = item.artist || '';
            button.append(name, artist);
            button.addEventListener('click', () =>
              control({ action: 'playItem', itemId: item.id }),
            );
            row.append(button);
            return row;
          }),
        );
        $('queue-empty').hidden = queue.length > 0;
      };

      /** Moves the bar between updates, so it doesn't jump once a second. */
      const renderPosition = () => {
        if (!snapshot) return;
        const { playback } = snapshot;
        const elapsed = playback.status === 'playing' ? Date.now() - lastUpdate : 0;
        const duration = playback.durationMs || 0;
        const position = Math.min(playback.positionMs + elapsed, duration || Infinity);
        $('position').textContent = formatTime(position);
        $('duration').textContent = formatTime(duration);
        $('progress').firstElementChild.style.width = duration
          ? `${(position / duration) * 100}%`
          : '0';
        $('progress').setAttribute('aria-valuenow', String(Math.round(position)));
        $('progress').setAttribute('aria-valuemax', String(Math.round(duration)));
      };
      setInterval(renderPosition, 250);

      const update = (next) => {
        snapshot = next;
        lastUpdate = Date.now();
        render();
      };

      const connect = () => {
        if (!token) return;
        if (events) events.close();
        events = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
        events.addEventListener('state', (event) => {
          retryMs = 1000;
          $('connection').textContent = 'Connected';
          showBanner('');
          update(JSON.parse(event.data));
        });
        events.onerror = () => {
          events.close();
          events = null;
          $('connection').textContent = 'Reconnecting…';
          // A removed device gets 401 from the stream too; ask the API to find out.
          api('/api/state')
            .then((state) => {
              update(state);
              setTimeout(connect, retryMs);
            })
            .catch(() => {
              if (token) {
                showBanner('Raygun is out of reach. Is it on and on the same Wi-Fi?');
                setTimeout(connect, retryMs);
              }
            });
          retryMs = Math.min(retryMs * 2, 30000);
        };
      };

      const control = async (command) => {
        try {
          update(await api('/api/control', { method: 'POST', body: JSON.stringify(command) }));
        } catch (error) {
          if (token) showBanner(error.message);
        }
      };

      $('toggle').addEventListener('click', () => control({ action: 'toggle' }));
      $('previous').addEventListener('click', () => control({ action: 'previous' }));
      $('next').addEventListener('click', () => control({ action: 'next' }));
      $('volume').addEventListener('change', (event) =>
        control({ action: 'volume', volume: Number(event.target.value) }),
      );
      $('progress').addEventListener('click', (event) => {
        const duration = snapshot && snapshot.playback.durationMs;
        if (!duration) return;
        const box = event.currentTarget.getBoundingClientRect();
        const fraction = Math.min(Math.max((event.clientX - box.left) / box.width, 0), 1);
        control({ action: 'seek', positionMs: Math.round(fraction * duration) });
      });

      // ---- Tabs and search ----

      const selectTab = (name) => {
        $('tab-queue').setAttribute('aria-selected', String(name === 'queue'));
        $('tab-search').setAttribute('aria-selected', String(name === 'search'));
        $('queue-panel').hidden = name !== 'queue';
        $('search-panel').hidden = name !== 'search';
        if (name === 'search') $('search').focus();
      };
      $('tab-queue').addEventListener('click', () => selectTab('queue'));
      $('tab-search').addEventListener('click', () => selectTab('search'));

      $('search-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = $('search').value.trim();
        if (!query) return;
        $('results').innerHTML = '<p class="muted">Searching…</p>';
        try {
          const { groups } = await api(`/api/search?q=${encodeURIComponent(query)}`);
          const nodes = [];
          for (const group of groups) {
            if (!group.tracks.length && !group.error) continue;
            const heading = document.createElement('p');
            heading.className = 'group';
            heading.textContent = group.name;
            nodes.push(heading);
            if (group.error) {
              const failed = document.createElement('p');
              failed.className = 'muted';
              failed.textContent = `This source failed: ${group.error}`;
              nodes.push(failed);
            }
            const list = document.createElement('ul');
            for (const track of group.tracks) {
              const row = document.createElement('li');
              const button = document.createElement('button');
              const name = document.createElement('span');
              name.className = 'name';
              name.textContent = track.title;
              const detail = document.createElement('span');
              detail.className = 'name muted';
              detail.textContent = [track.artist, track.album].filter(Boolean).join(' · ');
              button.append(name, detail);
              button.addEventListener('click', async () => {
                try {
                  update(
                    await api('/api/play', {
                      method: 'POST',
                      body: JSON.stringify({
                        title: track.title,
                        artist: track.artist,
                        album: track.album,
                      }),
                    }),
                  );
                  selectTab('queue');
                } catch (error) {
                  showBanner(error.message);
                }
              });
              row.append(button);
              list.append(row);
            }
            nodes.push(list);
          }
          if (!nodes.length) {
            const none = document.createElement('p');
            none.className = 'muted';
            none.textContent = `Nothing found for “${query}”.`;
            nodes.push(none);
          }
          $('results').replaceChildren(...nodes);
        } catch (error) {
          $('results').replaceChildren();
          showBanner(error.message);
        }
      });

      // ---- Start ----

      const start = async () => {
        $('pair').hidden = true;
        $('remote').hidden = false;
        try {
          update(await api('/api/state'));
          connect();
        } catch {
          /* unpair() already showed the pairing form */
        }
      };

      if (token && !pairCode()) start();
      else showPairing();
    </script>
  </body>
</html>
