[package]
name = "raygun-app-net"
description = "Raygun across devices: Play on TV"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-app-base.workspace = true
raygun-model.workspace = true
raygun-db.workspace = true
raygun-net.workspace = true
raygun-remote.workspace = true
tauri-plugin-raygun-audio.workspace = true
tauri.workspace = true
serde_json.workspace = true
specta.workspace = true
tauri-specta.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio = { version = "1", features = ["sync", "time", "fs", "rt", "io-util", "macros", "net"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
url = "2"
quick-xml = "0.42"
prost = { version = "0.13", default-features = false, features = ["derive", "std"] }
# Cast v2 runs over TLS to devices with self-signed certificates; SSDP searches go out of each
# network interface.
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
socket2 = "0.6"
if-addrs = "0.15"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "test-util"] }
axum.workspace = true