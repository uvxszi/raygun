[package]
name = "raygun-app"
description = "Raygun service wiring and Tauri command layer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-model.workspace = true
raygun-paths.workspace = true
raygun-db.workspace = true
raygun-playback.workspace = true
raygun-net.workspace = true
raygun-library.workspace = true
raygun-ext-host.workspace = true
raygun-resolver.workspace = true
raygun-mcp.workspace = true
raygun-remote.workspace = true
raygun-sync.workspace = true
raygun-ai.workspace = true
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-raygun-audio.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tokio = { version = "1", features = ["sync", "time", "fs", "rt"] }
flate2 = "1"
scraper = "0.24"
ego-tree = "0.10"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
base64 = "0.22"
uuid.workspace = true
prost = { version = "0.13", default-features = false, features = ["derive", "std"] }
quick-xml = "0.42"
# Exports (M46.1): page images decoded for PDFs, HLS segments decrypted when joined.
png = "0.18"
image-webp = "0.2"
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
# Music downloads (M46.10): decoding to save as WAV or FLAC, and tags on saved files.
symphonia = { version = "0.6", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "opt-simd"] }
hound = "3.5"
flacenc = "0.5"
lofty = "0.25"
mp3lame-encoder = "0.2.5"

# Copying pages on desktop (M46.6) and reading screenshots with ocrs (M46.21).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

# Reading screenshots where Windows' own OCR isn't there (M46.21): ocrs over rten.
[target.'cfg(not(windows))'.dependencies]
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = "0.26"
rten-imageproc = "0.26"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd.workspace = true
# One running copy on desktop (M46.11): two would share one database.
tauri-plugin-single-instance = "2.5"
# Discord presence (M46.16): its local IPC.
discord-rich-presence = "1.1"
# Copying a page to the clipboard on desktop (M46.6).
arboard = { version = "3", default-features = false, features = ["image-data"] }

# The desktop browser's blocker (M46.6): WebView2's request filter, at Tauri's own versions.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
# Windows' OCR reads screenshots for importing songs (M46.21).
windows = { version = "0.62", features = [
    "Win32_System_Com",
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
# Recording what Raygun plays (M46.10): WASAPI process loopback.
wasapi = "0.26"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum.workspace = true
