[package]
name = "raygun-net"
description = "Raygun networking: shared HTTP client and the loopback stream proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-model.workspace = true
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

tokio = { workspace = true, features = ["time"] }
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"

# Desktop checks certificates with the system (it fetches missing intermediates, as browsers do);
# Android keeps the bundled roots (its verifier needs a Java component). This section comes last:
# whatever follows a target header belongs to that target only (M46.12 found Android's build
# broken by it since M46.9.1).
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
