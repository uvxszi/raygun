[package]
name = "raygun-net"
description = "Raygun networking: shared HTTP client and the loopback stream proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
raygun-model.workspace = true
axum.workspace = true
reqwest.workspace = true
rustls.workspace = true
webpki-roots.workspace = true

# Desktop checks certificates with the system (it fetches missing intermediates, as browsers do);
# Android keeps the bundled roots (its verifier needs a Java component).
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-platform-verifier = "0.7"
tokio = { workspace = true, features = ["time"] }
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
tracing.workspace = true
thiserror.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
