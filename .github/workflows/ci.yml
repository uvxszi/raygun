name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: checks

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Includes the test that fails when packages/bindings is out of date.
      - run: cargo test --workspace

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: Build debug APK (arm64 + x86_64)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          pnpm android:build --debug --apk --target aarch64 --target x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: raygun-android-debug-${{ github.sha }}
          path: apps/raygun/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
