name: Release

# A tag like v1.0.0 builds Raygun for Windows (portable exe, setup exe, MSI) and Android (signed
# APKs), makes a draft release with the notes in docs/releases/<tag>.md, uploads the files to it,
# then publishes it. Android APKs are signed with the key in the repository's secrets, so each
# release installs as an update over the last one.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-windows

      - run: pnpm install --frozen-lockfile

      - name: Build the installers and the exe
        working-directory: apps/raygun
        run: pnpm tauri build

      - name: Name the files
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/raygun.exe "out/Raygun_${version}_x64_portable.exe"
          Get-ChildItem target/release/bundle/nsis/*-setup.exe | ForEach-Object { Copy-Item $_ "out/Raygun_${version}_x64-setup.exe" }
          Get-ChildItem target/release/bundle/msi/*.msi | ForEach-Object { Copy-Item $_ "out/Raygun_${version}_x64_en-US.msi" }
          Get-ChildItem out

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4
      - name: Install Android platform and NDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: Signing key from the repository's secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing: the APKs would not update the installed app"
            exit 1
          fi
          android=apps/raygun/src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/raygun-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/raygun-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$android/keystore.properties"

      - name: Build the APKs (one for every phone, and one per processor)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          version="${TAG#v}"
          apks=apps/raygun/src-tauri/gen/android/app/build/outputs/apk
          mkdir -p out
          # Copies the one APK matching a pattern, or fails the release.
          take() {
            found=$(find "$apks" -name "$1" -path "*release*" | grep -v unsigned | head -1)
            if [ -z "$found" ]; then echo "::error::no signed APK matches $1"; find "$apks" -name "*.apk"; exit 1; fi
            cp "$found" "out/$2"
          }
          pnpm android:build --apk --target aarch64 --target x86_64
          take "*universal*.apk" "Raygun_${version}_android_universal.apk"
          pnpm android:build --apk --split-per-abi --target aarch64 --target x86_64
          take "*arm64*.apk" "Raygun_${version}_android_arm64.apk"
          take "*x86_64*.apk" "Raygun_${version}_android_x86_64.apk"
          ls -la out

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in out/*.apk; do "$apksigner" verify --print-certs "$apk" | head -3; done

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: out/*
          if-no-files-found: error

  release:
    name: Release
    needs: [windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v7
        with:
          path: files
          merge-multiple: true

      - name: Draft the release with its notes and files, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          notes="docs/releases/${TAG}.md"
          if [ ! -f "$notes" ]; then echo "::error::$notes is missing"; exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --clobber
            gh release edit "$TAG" --notes-file "$notes" --title "Raygun ${version}"
          else
            gh release create "$TAG" files/* --draft --title "Raygun ${version}" --notes-file "$notes" --verify-tag
          fi
          gh release edit "$TAG" --draft=false --latest
