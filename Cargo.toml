[workspace]
resolver = "3"
members = ["apps/raygun/src-tauri", "crates/*", "plugins-mobile/*"]
exclude = ["third_party"]

[workspace.package]
version = "1.9.4"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
raygun-model = { path = "crates/raygun-model" }
raygun-paths = { path = "crates/raygun-paths" }
raygun-db = { path = "crates/raygun-db" }
raygun-playback = { path = "crates/raygun-playback" }
raygun-net = { path = "crates/raygun-net" }
raygun-ai = { path = "crates/raygun-ai" }
raygun-library = { path = "crates/raygun-library" }
raygun-ext-host = { path = "crates/raygun-ext-host" }
raygun-resolver = { path = "crates/raygun-resolver" }
raygun-app = { path = "crates/raygun-app" }
raygun-mcp = { path = "crates/raygun-mcp" }
raygun-remote = { path = "crates/raygun-remote" }
raygun-sync = { path = "crates/raygun-sync" }
raygun-torrent = { path = "crates/raygun-torrent" }
tauri-plugin-raygun-audio = { path = "plugins-mobile/raygun-audio" }

tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
rfd = { version = "0.17", default-features = false, features = ["gtk3", "common-controls-v6"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "v7"] }
thiserror = "2"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "http2", "charset", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
tokio = { version = "1", features = ["rt", "net", "sync", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs"] }

# Raygun's own crates keep line tables (backtraces name files and lines) but not full debug info,
# which made most of each incremental cache; dependencies' symbols made a debug APK ~570 MB and
# slowed builds, and nobody steps through them.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# QuickJS is an interpreter written in C; unoptimized it made a debug build's extension searches
# several times slower (most time goes to JSON.parse of large API responses).
[profile.dev.package.rquickjs-sys]
opt-level = 3

# RSA key pairs converted Mihon sources make (`KeyPairGenerator.getInstance("RSA")`): finding
# 2048-bit primes is big-number arithmetic, slow unoptimized in the debug builds the emulator runs.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# Whisper (M46.32) is matrix math on the CPU: unoptimized, one 30-second window took minutes in the
# debug builds the emulator runs.
[profile.dev.package.candle-core]
opt-level = 3

[profile.dev.package.candle-nn]
opt-level = 3

[profile.dev.package.candle-transformers]
opt-level = 3

[profile.dev.package.gemm-common]
opt-level = 3

[profile.dev.package.gemm-f32]
opt-level = 3

# Its half-float assembly only builds for 64-bit ARM when inlined into the fp16 functions, which
# needs optimizing (M46.47: CI's arm64 debug APK failed with "instruction requires: fullfp16").
[profile.dev.package.gemm-f16]
opt-level = 3

[profile.dev.package.gemm]
opt-level = 3

[profile.dev.package.raygun-ai]
opt-level = 3

# Decoding songs and episodes for transcription (and downloads' transcoding): unoptimized, a
# debug build's MP3 or AAC decode took seconds per 30-second window on a phone.
[profile.dev.package.symphonia-core]
opt-level = 3

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-codec-aac]
opt-level = 3

[profile.dev.package.symphonia-bundle-flac]
opt-level = 3

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3

[profile.dev.package.symphonia-format-isomp4]
opt-level = 3

# Reading the words on comic pages and screenshots (ocrs over rten): unoptimized, one page kept
# every core of the emulator busy for minutes in a debug build.
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package.rten-base]
opt-level = 3

[profile.dev.package.rten-gemm]
opt-level = 3

[profile.dev.package.rten-imageproc]
opt-level = 3

[profile.dev.package.rten-parallel]
opt-level = 3

[profile.dev.package.rten-simd]
opt-level = 3

[profile.dev.package.rten-tensor]
opt-level = 3

[profile.dev.package.rten-vecmath]
opt-level = 3

# PDF pages drawn and their text read (`raygun_net::pdf`, hayro over vello_cpu): unoptimized, a page
# took seconds to draw in the debug builds the emulator runs.
[profile.dev.package.hayro]
opt-level = 3

[profile.dev.package.hayro-interpret]
opt-level = 3

[profile.dev.package.hayro-syntax]
opt-level = 3

[profile.dev.package.hayro-font]
opt-level = 3

[profile.dev.package.hayro-jpeg2000]
opt-level = 3

[profile.dev.package.hayro-jbig2]
opt-level = 3

[profile.dev.package.hayro-ccitt]
opt-level = 3

[profile.dev.package.vello_cpu]
opt-level = 3

[profile.dev.package.vello_common]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# Search's calculator (fend: arbitrary-precision numbers) answers within a fraction of a second
# only optimized, in the debug builds the emulator runs too.
[profile.dev.package.fend-core]
opt-level = 3

# Kodi add-ons' Python (RustPython, `raygun-ext-host::kodi`): an interpreter is many times slower
# unoptimized, and a plugin's listing took seconds in the debug builds the emulator runs.
[profile.dev.package.rustpython-vm]
opt-level = 3

[profile.dev.package.rustpython-stdlib]
opt-level = 3

[profile.dev.package.rustpython-common]
opt-level = 3

[profile.dev.package.rustpython-sre_engine]
opt-level = 3

[profile.dev.package.rustpython-codegen]
opt-level = 3

[profile.dev.package.rustpython-compiler-core]
opt-level = 3

[profile.dev.package.rustpython-ruff_python_parser]
opt-level = 3

[profile.dev.package.malachite-nz]
opt-level = 3

# The interpreter is among the largest code in the app; optimized for size it's markedly smaller
# and still fast enough for add-ons, which mostly wait on the network.
[profile.release.package.rustpython-vm]
opt-level = "s"

[profile.release.package.rustpython-stdlib]
opt-level = "s"

[profile.release.package.rustpython-codegen]
opt-level = "s"

[profile.release.package.rustpython-ruff_python_parser]
opt-level = "s"

[profile.release.package.rustpython-ruff_python_ast]
opt-level = "s"

# Panics unwind, never abort (M46.7): on Windows, Lua's errors (Shosetsu scripts, mlua) travel as
# SEH unwinds through Rust frames, and with `panic = "abort"` any script error ended the whole app.
# Unwinding also lets a panic stop one worker thread instead of the process.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

# Vendored copies, changed to build for every target (see third_party/README.md).
[patch.crates-io]
rquickjs-sys = { path = "third_party/rquickjs-sys" }
mp3lame-sys = { path = "third_party/mp3lame-sys" }
librqbit-sha1-wrapper = { path = "third_party/librqbit-sha1-wrapper" }
librqbit-dualstack-sockets = { path = "third_party/librqbit-dualstack-sockets" }
rustpython-host_env = { path = "third_party/rustpython-host_env" }
