[package]
name = "raygun"
description = "Raygun multimedia app (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519 on Windows).
name = "raygun_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
raygun-app.workspace = true
# Direct dependency so tauri-build sees the plugin's Android module (Cargo `links` metadata only
# reaches direct dependents) and includes it in the Gradle build.
tauri-plugin-raygun-audio.workspace = true
# The same for the notification plugin's Android module (M46.42).
tauri-plugin-notification = "2"
tauri.workspace = true
